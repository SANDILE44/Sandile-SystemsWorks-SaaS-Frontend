<!DOCTYPE html>  
<html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Sign In - Sandile SystemsWorks</title>  
    
    <!-- TAILWIND & LUCIDE ENGINE CORE -->
    <script src="https://cdn.tailwindcss.com"></script>  
    <script src="https://unpkg.com/lucide@latest"></script>  
    
    <!-- GOOGLE IDENTITY SERVICES ENGINE -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
<style>  
        /* ── SYSTEM DESIGN SYSTEM VARIABLES ── */
        :root {  
            --bg-main: #020617;  
            --accent: #00b4d8;  
            --border-soft: rgba(255, 255, 255, 0.06);  
        }  

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--bg-main);
            color: #e5e7eb;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .glass {  
            background: rgba(255, 255, 255, 0.02);  
            backdrop-filter: blur(16px);  
            border: 1px solid var(--border-soft);  
        }  

        /* ── AUTH CARD ARCHITECTURE ── */
        .auth-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6rem 1.5rem 2rem 1.5rem;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border-soft);
            border-radius: 4px;
            padding: 2.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: #94a3b8;
        }

        .form-group input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            padding: 0.75rem 1rem;
            color: #ffffff;
            font-size: 0.875rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(0, 180, 216, 0.02);
            box-shadow: 0 0 12px rgba(0, 180, 216, 0.1);
        }

        .auth-submit {
            width: 100%;
            background: var(--accent);
            color: #000000;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.2em;
            padding: 1rem;
            border-radius: 2px;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .auth-submit:hover:not(:disabled) {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .auth-submit:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ── SYSTEMSWORKS INTERACTIVE LOADER ── */  
        #system-loader {  
            position: fixed;  
            inset: 0;  
            background: rgba(2, 6, 23, 0.96);  
            backdrop-filter: blur(12px);  
            display: flex;  
            align-items: center;  
            justify-content: center;  
            z-index: 9999;  
            opacity: 0;  
            pointer-events: none;
            transition: opacity 0.3s ease;
        }  
          
        #system-loader.show {  
            opacity: 1;  
            pointer-events: auto;
        }  
          
        .loader-wrap {  
            position: relative;  
            width: 110px;  
            height: 110px;  
            display: flex;  
            align-items: center;  
            justify-content: center;  
        }  
          
        .loader-ring {  
            position: absolute;  
            inset: 0;  
            border-radius: 50%;  
            border: 2.5px solid rgba(0, 180, 216, 0.1);  
            border-top-color: var(--accent);  
            animation: loaderSpin 0.85s linear infinite;  
            box-shadow: 0 0 24px rgba(0, 180, 216, 0.15);  
        }  
          
        @keyframes loaderSpin {  
            to { transform: rotate(360deg); }  
        }  
          
        .loader-logo {  
            width: 56px;  
            height: 56px;  
            object-fit: contain;  
            position: relative;  
            z-index: 1;  
            animation: logoPulse 1.4s ease-in-out infinite;  
        }  
          
        @keyframes logoPulse {  
            0%, 100% { filter: drop-shadow(0 0 12px rgba(0, 180, 216, 0.4)); }  
            50%      { filter: drop-shadow(0 0 30px rgba(0, 180, 216, 0.8)); }  
        }  
          
        .loader-glow {  
            position: absolute;  
            width: 180px;  
            height: 180px;  
            border-radius: 50%;  
            background: radial-gradient(circle, rgba(0, 180, 216, 0.1) 0%, transparent 70%);  
            animation: glowPulse 1.4s ease-in-out infinite;  
            pointer-events: none;  
        }  
          
        @keyframes glowPulse {  
            0%, 100% { transform: scale(1); opacity: 0.7; }  
            50%      { transform: scale(1.2); opacity: 1; }  
        }  
          
        /* SUCCESS TICK SYSTEM - FIXED DIMENSIONS */  
        .success-wrap {  
            position: absolute;  
            width: 110px;        /* Match exact width of loader-wrap */
            height: 110px;       /* Match exact height of loader-wrap */
            display: flex;  
            align-items: center;  
            justify-content: center;  
            opacity: 0;  
            pointer-events: none;  
            transition: opacity 0.25s ease;  
        }  
          
        .success-wrap.show {  
            opacity: 1;  
        }  
          
        .success-circle {  
            position: absolute;  
            inset: 0;  
            border-radius: 50%;  
            border: 2.5px solid #00e87a;  
            transform: scale(0);  
        }  
          
        .success-circle.pop {  
            animation: circlePop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,  
                      circleGlow 1.2s ease-in-out infinite 0.4s;  
        }  
          
        @keyframes circlePop {  
            from { transform: scale(0.5); opacity: 0; }  
            to   { transform: scale(1); opacity: 1; }  
        }  
          
        @keyframes circleGlow {  
            0%, 100% { box-shadow: 0 0 16px rgba(0, 232, 122, 0.2); }  
            50%      { box-shadow: 0 0 32px rgba(0, 232, 122, 0.5); }  
        }  
          
        .success-svg {  
            width: 38px;  
            height: 38px;  
            stroke: #00e87a;  
            stroke-width: 3;  
            stroke-linecap: round;  
            stroke-linejoin: round;  
            fill: none;  
            position: relative;  
            z-index: 1;  
            filter: drop-shadow(0 0 8px rgba(0, 232, 122, 0.8));  
        }  
          
        .success-path {  
            stroke-dasharray: 50;  
            stroke-dashoffset: 50;  
        }  
          
        .success-path.draw {  
            animation: drawCheck 0.45s ease forwards 0.15s;  
        }  
          
        @keyframes drawCheck {  
            to { stroke-dashoffset: 0; }  
        }  
    </style>
</head>  
<body class="antialiased">  

    <!-- TOP NAVIGATION -->  
    <nav class="fixed w-full z-50 top-0 glass border-b border-white/5">  
        <div class="max-w-7xl mx-auto px-6 lg:px-8">  
            <div class="flex items-center justify-between h-20">  
                <div class="flex items-center gap-3">  
                    <img src="images/Untitled design.png" alt="Logo" class="h-8 w-auto">  
                    <span class="text-lg font-bold tracking-tighter text-white uppercase italic">  
                        Sandile <span class="text-[#00b4d8]">SystemsWorks</span>  
                    </span>  
                </div>  
                <div>  
                    <a href="signup.html" class="bg-[#00b4d8] text-black px-5 py-2 text-[10px] uppercase font-bold tracking-wider rounded-sm hover:opacity-90 transition">  
                        Start free trial  
                    </a>  
                </div>  
            </div>  
        </div>  
    </nav>  

    <!-- CENTERED CONTENT LAYER -->  
    <main class="auth-wrapper">  
        <div class="auth-card">  
            <div class="text-center mb-8">  
                <img src="images/Untitled design.png" alt="Logo" class="h-10 w-auto mx-auto mb-4">  
                <h1 class="text-2xl font-extrabold text-white tracking-tight uppercase italic mb-1">Welcome back</h1>  
                <p class="text-xs text-slate-400 font-light">Sign in to your Sandile SystemsWorks account.</p>  
            </div>

            <form id="loginForm">  
                <div class="form-group">  
                    <label for="email">Email address</label>  
                    <input type="email" id="email" placeholder="your@email.com" required>  
                </div>  
                <div class="form-group">  
                    <label for="password">Password</label>  
                    <input type="password" id="password" placeholder="Your password" required>  
                </div>  
                <button type="submit" class="auth-submit">Sign in</button>  
                <p id="msg" class="text-xs text-center mt-4 font-medium"></p>  
            </form>  

            <!-- ── SYSTEMSWORKS ORBITAL BREAK LINE ── -->
            <div class="relative flex py-5 items-center">
                <div class="flex-grow border-t border-white/5"></div>
                <span class="flex-shrink mx-4 text-[10px] text-slate-500 font-bold uppercase tracking-widest">OR</span>
                <div class="flex-grow border-t border-white/5"></div>
            </div>

            <!-- ── GOOGLE AUTH PLATFORM MOUNT ELEMENT ── -->
            <div class="flex justify-center w-full">
                <div id="g_id_onload"
                     data-client_id="1064963647591-k76sv5dgcm3ihrsbmaccr63rij0vikda.apps.googleusercontent.com"
                     data-context="signin"
                     data-ux_mode="popup"
                     data-callback="handleGoogleCredentialResponse"
                     data-auto_prompt="false">
                </div>
                <div class="g_id_signin"
                     data-type="standard"
                     data-shape="rectangular"
                     data-theme="filled_black"
                     data-text="signin_with"
                     data-size="large"
                     data-logo_alignment="left"
                     data-width="360">
                </div>
            </div>

            <div class="text-center mt-6 text-xs text-slate-500">  
                Don't have an account? <a href="signup.html" class="text-[#00b4d8] hover:underline">Create one</a>  
            </div>  
        </div>  
    </main>  

    <!-- METRIC LOADER OVERLAY FRAMEWORK -->  
    <div id="system-loader">  
        <div class="loader-wrap" id="loader-elements">  
            <div class="loader-glow"></div>  
            <div class="loader-ring"></div>  
            <img src="images/Untitled design.png" alt="Loading Industrial Logic" class="loader-logo">  
        </div>  

        <!-- ANIMATED VERDICT CONFIRMATION -->  
        <div class="success-wrap" id="success-element">  
            <div class="success-circle" id="success-circle"></div>  
            <svg class="success-svg" viewBox="0 0 24 24">  
                <path class="success-path" id="success-path" d="M20 6L9 17l-5-5"></path>  
            </svg>  
        </div>  
    </div>  

    <script src="js/config.js"></script>  
    <script src="js/api.js"></script>  
    <script src="js/auth.js"></script>  
    
    <!-- INTERACTION & TRANSITION CONTROLLER -->
    <script>
        const msg = document.getElementById('msg');

        function showMsg(text, isError = false) {
            msg.textContent = text;
            msg.className = `text-xs text-center mt-4 font-medium ${isError ? 'text-red-400' : 'text-emerald-400'}`;
            msg.style.display = text ? 'block' : 'none';
        }

        // Shared function to trigger the hardware loader sequence animations
        function executeSuccessAnimation() {
            const loaderElements = document.getElementById('loader-elements');
            const successElement = document.getElementById('success-element');
            const successCircle = document.getElementById('success-circle');
            const successPath = document.getElementById('success-path');

            // Terminate background spinning configurations
            loaderElements.style.display = 'none';

            // Display success check transition elements
            successElement.classList.add('show');
            successCircle.classList.add('pop');
            successPath.classList.add('draw');

            // Complete system handshake and route inside dashboard environment
            setTimeout(() => {
                window.location.href = 'dashboard.html'; 
            }, 1300);
        }

        /* ── STANDARD EMAIL SIGNIN HANDLER ── */
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            showMsg('');
            
            const loader = document.getElementById('system-loader');
            const submitBtn = this.querySelector('button[type="submit"]');
            
            submitBtn.disabled = true;
            loader.classList.add('show');

            // Simulate or replace with your actual traditional email validation layout
            setTimeout(() => {
                executeSuccessAnimation();
            }, 2000); 
        });

        /* ── GLOBAL GOOGLE OAUTH INTERACTION HANDLER ── */
        async function handleGoogleCredentialResponse(response) {
            showMsg('');
            const loader = document.getElementById('system-loader');
            const submitBtn = document.querySelector('#loginForm button[type="submit"]');
            
            submitBtn.disabled = true;
            loader.classList.add('show');
            
            try {
                // Pointing directly to your sandile-systemsworks-saas-backend-2 backend on Render
                const backendRes = await fetch('https://sandile-systemsworks-saas-backend-2.onrender.com/api/auth/google', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ token: response.credential })
                });
                
                const data = await backendRes.json();
                
                if (!backendRes.ok || data.error) {
                    throw new Error(data.error || 'Google authentication handshake rejected.');
                }
                
                // Store token using your internal session layout utility files safely
                if (window.auth && typeof window.auth.setToken === 'function') {
                    window.auth.setToken(data.token);
                } else {
                    localStorage.setItem('auth_token', data.token);
                }
                
                // Trigger the matching metric checkmark sequence animation
                executeSuccessAnimation();
                
            } catch (err) {
                // Clear out components on failure so user isn't stuck behind overlay
                loader.classList.remove('show');
                submitBtn.disabled = false;
                showMsg(err.message || 'Google verification failed.', true);
            }
        }

        // Initialize Lucide iconography array safely once loaded
        document.addEventListener("DOMContentLoaded", function() {
            if(window.lucide) {
                lucide.createIcons();
            }
        });
    </script>
</body>  
</html>
