<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Project Analysis | Sandile SystemsWorks</title>
  <!-- Google Fonts for that IBM Plex look in your CSS -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* DIRECTLY INJECTING YOUR THEME VARS */
    :root {
      --bg-main: #020617;
      --bg-soft: rgb(4, 9, 24);
      --border-soft: rgba(255, 255, 255, 0.08);
      --text-main: #e5e7eb;
      --text-muted: #94a3b8;
      --accent: #00b4d8;
    }

    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, var(--bg-soft), var(--bg-main));
      color: var(--text-main);
      font-family: 'IBM Plex Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .report-container {
      width: 90%;
      max-width: 600px;
      background: var(--bg-main);
      border: 1px solid var(--border-soft);
      border-radius: 24px;
      padding: 2.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border-soft);
      padding-bottom: 1.5rem;
    }

    .brand-tag {
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.5rem;
      display: block;
    }

    h1 {
      font-size: 1.8rem;
      margin: 0;
      letter-spacing: -0.02em;
    }

    /* DATA GRID */
    .data-grid {
      display: grid;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .data-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border-soft);
      padding: 1.2rem;
      border-radius: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .label { color: var(--text-muted); font-size: 0.9rem; font-weight: 600; }
    .value { font-weight: 800; font-size: 1.1rem; }

    /* DECISION PANEL (Matches your CSS) */
    .decision-panel {
      padding: 1.5rem;
      border-radius: 16px;
      text-align: center;
      font-weight: 700;
      margin-top: 1.5rem;
    }

    /* Footer */
    footer {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Loading Spinner */
    .loader {
      border: 3px solid rgba(0, 180, 216, 0.1);
      border-top: 3px solid var(--accent);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 2rem auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="report-container">
    <header>
      <span class="brand-tag">Sandile SystemsWorks • Project Insight</span>
      <h1 id="title">Loading Analysis...</h1>
    </header>

    <div id="content">
      <div class="loader"></div>
    </div>

    <footer>
      <p>Proprietary Decision Engine &copy; 2026</p>
      <p style="margin-top: 5px; color: var(--accent);">Secure Analysis Verified</p>
    </footer>
  </div>

  <!-- FIXED SCRIPT PATH -->
  <script src="js/share.js"></script>
</body>
</html>
